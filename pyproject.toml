[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bukmarks"
dynamic = ["version"]
description = "Bookmarks manager da riga di comando con salvataggio automatico su git"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ email = "just4dev@pm.me" }]
keywords = ["bookmarks", "cli", "git", "terminal"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
bukmarks = "bukmarks.cli:main"

[tool.setuptools]
packages = ["bukmarks"]

[tool.setuptools.dynamic]
version = { attr = "bukmarks.__version__" }
